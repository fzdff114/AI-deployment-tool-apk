name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Avoid parallel runs racing to overwrite the same versioned APK release asset.
concurrency:
  group: ai-studio-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Configure persistent APK signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            KEYSTORE="$RUNNER_TEMP/ai-studio-upload.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            test -s "$KEYSTORE"
            echo "AI_STUDIO_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
            echo "AI_STUDIO_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "AI_STUDIO_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "AI_STUDIO_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Persistent APK signing keystore configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Persistent signing secrets are not configured. This build will use the Gradle debug certificate; updates signed with a different debug certificate may require uninstalling the older app first."
            echo "No persistent signing secrets configured; using the automatically generated debug certificate. Add the four ANDROID_* signing secrets to enable stable in-place updates." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build standalone APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"
          CERT_SHA256=$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/apk-signature.txt" | awk '{print $NF}')
          test -n "$CERT_SHA256"
          echo "AI_STUDIO_APK_CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"
          {
            echo "### APK signature verification"
            echo "- Signature verification: passed"
            echo "- Signing certificate SHA-256: `$CERT_SHA256`"
            echo "- APK contains a valid Android APK signing block; no separate CA certificate installation is required."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIStudio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          TAG="v${VERSION}"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ASSET="AIStudio-${VERSION}-arm64-signed.apk"
          test -s "$APK"
          cp "$APK" "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete-asset "$TAG" app-debug.apk --yes >/dev/null 2>&1 || true
            gh release upload "$TAG" "$ASSET" --clobber
          else
            NOTES="$(cat <<EOF
Standalone Android ARM64 APK. Install directly on Android 9+ devices.

APK zip alignment and signing certificate have been verified in CI.
Certificate SHA-256: ${AI_STUDIO_APK_CERT_SHA256:-unknown}.

If Android reports an update/signature conflict, uninstall the previous build first. After configuring the persistent signing secrets, future updates will use the same signing certificate.
EOF
)"
            gh release create "$TAG" "$ASSET" \
              --title "AI Studio ${VERSION}" \
              --notes "$NOTES"
          fi
